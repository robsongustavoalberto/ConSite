<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConSite - Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script offline/local para geração do QR Code sem dependência de internet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="card">
        <!-- Banner/Tag Código Aberto -->
        <span class="open-source-badge">Código Aberto</span>

        <!-- Logo com Animação -->
        <div class="logo-container">
            <img src="assets/logo.png" alt="ConSite Logo" class="app-logo" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
            <h1 id="alt-logo" class="logo-fallback" style="display: none;">ConSite</h1>
        </div>

        <!-- Texto Atualizado -->
        <p class="tagline">Converta qualquer informação em QR Code instantaneamente.</p>

        <!-- Formulário de Entrada -->
        <div class="input-container">
            <input type="text" id="linkInput" placeholder="Cole a sua informação ou link aqui..." autocomplete="off">
            <button id="generateBtn">
                <span>Gerar QR Code</span>
            </button>
        </div>

        <!-- Área de Exibição do QR Code -->
        <div id="qrWrapper" class="qr-wrapper hidden">
            <div id="qrcode"></div>
            <button id="downloadBtn" class="download-btn">Baixar QR Code</button>
        </div>

        <!-- Botão para Baixar APK no MediaFire (Para quem acede ao site) -->
        <div class="apk-download-container" style="margin-top: 20px;">
            <a href="https://www.mediafire.com/file/xxq495nhnfneh0x/app-release.apk/file" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
                <button type="button" style="background-color: #2563eb; color: #ffffff; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; width: 100%;">
                    Baixar App Android (APK)
                </button>
            </a>
        </div>

        <!-- Rodapé com Link para o Repositório do GitHub -->
        <div class="footer-github" style="margin-top: 20px; font-size: 13px; color: #64748b;">
            <p>Gostou do projeto? 
                <a href="https://github.com/robsongustavoalberto/ConSite" target="_blank" rel="noopener noreferrer" style="color: #0284c7; font-weight: 600; text-decoration: underline;">
                    Colabore ou dê suporte no GitHub
                </a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
